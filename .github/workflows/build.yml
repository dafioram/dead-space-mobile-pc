name: Windows and Linux builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asset-policy:
    name: Private-data policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check all indexed files, including force-added files
        run: python tools/check_assets.py --tracked
      - name: Exercise the policy checker
        run: python -m unittest discover -s tests -p test_asset_policy.py -v

  build:
    name: Build and test (${{ matrix.platform }})
    needs: asset-policy
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build libsdl2-dev libboost-dev zlib1g-dev libgl-dev
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-zlib
      - name: Configure, build and test Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          python tools/stage_build.py --platform linux-x86_64 --build-dir build --output release/staging
          python tools/check_assets.py --package release/staging
      - name: Configure, build and test Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          python tools/stage_build.py --platform windows-x86_64 --build-dir build --output release/staging --mingw-prefix "$MINGW_PREFIX"
          python tools/check_assets.py --package release/staging
      - name: Upload only the checked staging directory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deadspace-${{ matrix.platform }}-${{ github.sha }}
          path: release/staging/
          if-no-files-found: error
          retention-days: 14
