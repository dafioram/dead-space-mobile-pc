name: Portable release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to backfill (for example v1.1-rc1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      tools_commit: ${{ steps.release.outputs.tools_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Validate published release and main-ancestry tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit=$(python tools/release_package.py resolve --tag "$TAG")
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .draft)" = false
          printf 'tag=%s\ncommit=%s\n' "$TAG" "$commit" >> "$GITHUB_OUTPUT"
          printf 'tools_commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      # Keep packaging tools separate so manual backfills also work for older
      # tags which predate this workflow. The application source is always pinned.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.tools_commit }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          path: source
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Private-data policy before building
        run: python ../automation/tools/check_assets.py --tracked
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build libsdl2-dev libboost-dev zlib1g-dev libgl-dev
      - name: Windows dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2 mingw-w64-x86_64-boost mingw-w64-x86_64-zlib
      - name: Linux build, tests and allowlisted staging
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          strip --strip-debug build/deadspace
          python ../automation/tools/stage_build.py --platform linux-x86_64 --build-dir build --output staging --source-root . --release-tag "$RELEASE_TAG"
      - name: Windows build, tests and allowlisted staging
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          strip --strip-debug build/deadspace.exe
          python ../automation/tools/stage_build.py --platform windows-x86_64 --build-dir build --output staging --mingw-prefix "$MINGW_PREFIX" --source-root . --release-tag "$RELEASE_TAG"
      - name: Package portable archive and checksum
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python ../automation/tools/release_package.py pack --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --platform "$PLATFORM" --staging staging --output release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-${{ matrix.platform }}
          path: source/release-assets/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.tools_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: portable-*
          path: incoming
      - name: Verify both archives and unchanged tag, then attach without overwriting
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .draft)" = false
          for platform in windows-x86_64 linux-x86_64; do
            archive="incoming/portable-$platform/deadspace-$RELEASE_TAG-$platform-portable.zip"
            python tools/release_package.py verify --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --platform "$platform" --archive "$archive"
          done
          gh release upload "$RELEASE_TAG" \
            "incoming/portable-windows-x86_64/deadspace-$RELEASE_TAG-windows-x86_64-portable.zip" \
            "incoming/portable-windows-x86_64/deadspace-$RELEASE_TAG-windows-x86_64-portable.zip.sha256" \
            "incoming/portable-linux-x86_64/deadspace-$RELEASE_TAG-linux-x86_64-portable.zip" \
            "incoming/portable-linux-x86_64/deadspace-$RELEASE_TAG-linux-x86_64-portable.zip.sha256"
